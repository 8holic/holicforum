baseurl: "/holicforum"
url: "https://8holic.github.io"
title: "The Lamplight"
future: true
# Collections for each forum category
collections:
  ongoing_cases:
    output: true
    permalink: /categories/ongoing/:name/
  announcements:
    output: true
    permalink: /categories/announcements/:name/
  solved_mysteries:
    output: true
    permalink: /categories/solved/:name/
  tech_tips:
    output: true
    permalink: /categories/techtips/:name/
  user_introductions:
    output: true
    permalink: /categories/introductions/:name/
  lifestyle_general:
    output: true
    permalink: /categories/lifestyle/:name/

  # Keep existing collections if you still need them

  hidden_posts:
    output: true
    permalink: /hidden/:slug/

# Default layout for all posts in these collections
defaults:
  - scope:
      path: ""
      type: "ongoing_cases"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "announcements"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "solved_mysteries"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "tech_tips"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "user_introductions"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "lifestyle_general"
    values:
      layout: "post"

  # Existing defaults

  - scope:
      path: ""
      type: "hidden_posts"
    values:
      layout: "post"